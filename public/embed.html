<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
</head>
<body>
  <video id="video" controls playsinline></video>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const streamUrl = urlParams.get('url');
    const posterUrl = urlParams.get('poster');
    const initialTime = parseFloat(urlParams.get('t') || '0');

    const video = document.getElementById('video');

    if (posterUrl) {
      video.poster = posterUrl;
    }

    if (streamUrl) {
      // Check for native HLS support (Safari/iOS)
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        if (initialTime > 0) {
          video.addEventListener('loadedmetadata', () => {
            video.currentTime = initialTime;
          }, { once: true });
        }
      } 
      // Fallback to hls.js for browsers that don't support m3u8 natively (Chrome, Firefox, etc.)
      else if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 30,
          enableSoftwareAES: true,
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (initialTime > 0) {
            video.currentTime = initialTime;
          }
        });
        
        // Handle stream recovery
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.log('fatal media error encountered, try to recover');
                hls.recoverMediaError();
                break;
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.error('fatal network error encountered', data);
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else {
        alert('Your browser does not support HLS playback.');
      }

      // Propagate timeupdate to parent window if desired (for watch history)
      video.addEventListener('timeupdate', () => {
        if (window.parent) {
          window.parent.postMessage({
            type: 'PLAYER_TIMEUPDATE',
            currentTime: video.currentTime,
            duration: video.duration
          }, '*');
        }
      });
    }
  </script>
</body>
</html>
